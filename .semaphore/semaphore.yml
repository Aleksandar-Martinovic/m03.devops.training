version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: 1-Signing
    dependencies: []
    task:
      jobs:
        - name: Import keys
          commands:
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - checkout
            - cd 1-signing
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: private_key-Aleksandar
        - name: public_key-Aleksandar
  - name: "\U0001F680 2-sbom"
    dependencies:
      - 1-Signing
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - checkout
            - cd 2-sbom
            - python3 -m venv venv
            - source venv/bin/activate
            - pip install cyclonedx-bom
            - cyclonedx-py requirements -o bom.json
